[package]
name = "grabmeta"
version = "2.3.3"
description = "Vue and Tauri desktop interface for yt-dlp"
authors = ["GrabMeta contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "grabmeta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "fs"] }
url = "2"
semver = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy", "stream", "socks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
